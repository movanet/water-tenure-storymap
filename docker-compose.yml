# Water Tenure Storymap: web app + tenure engine API.
#
#   cp .env.example .env    # then edit .env
#   docker compose up -d --build
#
# Both services bind to 127.0.0.1 by default, so they are reachable only
# from this machine. Put a TLS reverse proxy in front of them (see
# deploy/Caddyfile.example and docs/INSTALL.md) rather than exposing the
# ports directly. Settings are read from .env; see .env.example.

name: water-tenure-storymap

services:
  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      TENURE_API_TOKEN: ${TENURE_API_TOKEN:-}
      SEED_SAMPLE: ${SEED_SAMPLE:-false}
      SEED_FILE: ${SEED_FILE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DATA_ATTRIBUTION: ${DATA_ATTRIBUTION:-Water Tenure Storymap deployment}
      EXPORT_DESCRIPTION: ${EXPORT_DESCRIPTION:-Public-sensitivity water tenure records.}
      FUZZ_MIN_METERS: ${FUZZ_MIN_METERS:-250}
      FUZZ_MAX_METERS: ${FUZZ_MAX_METERS:-1000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      STRIP_EXIF: ${STRIP_EXIF:-true}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_API_URL: ${VISION_API_URL:-https://api.openai.com/v1/chat/completions}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
    volumes:
      # SQLite database, photos and thumbnails. Back this volume up.
      - tenure-data:/data
      # Optional: your own records to seed an empty database. Put the file
      # in ./seed/ and set SEED_FILE=/seed/records.geojson in .env.
      # - ./seed:/seed:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  tenure-data:
